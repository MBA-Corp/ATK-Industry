name: Backend verification

on:
  pull_request:
    paths:
      - 'apps/api/**'
      - 'docs/architecture/api-contract-v1.0.yaml'
      - 'compose.test.yaml'
      - '.github/workflows/backend-verification.yml'
  push:
    branches:
      - 'feat/backend-release-hardening'
    paths:
      - 'apps/api/**'
      - 'docs/architecture/api-contract-v1.0.yaml'
      - 'compose.test.yaml'
      - '.github/workflows/backend-verification.yml'

permissions:
  contents: read

concurrency:
  group: backend-verification-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated backend verification
        run: docker compose -p atk-ci -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from api-test --attach api-test
      - name: Remove verification containers
        if: always()
        run: docker compose -p atk-ci -f compose.test.yaml down
