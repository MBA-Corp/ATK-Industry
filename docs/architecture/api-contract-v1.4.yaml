            type: object
            required: [unit_id, conversion_to_base, selling_price, is_base]
            properties:
              id:
                type: integer
                format: int64
                nullable: true
              client_key:
                type: string
                description: Temporary local key used to resolve a barcode to a newly created unit.
              unit_id:
                type: integer
                format: int64
              conversion_to_base:
                type: number
                format: decimal
                exclusiveMinimum: 0
              selling_price:
                $ref: '#/components/schemas/Money'
              is_base: {type: boolean}
              is_active:
                type: boolean
                default: true
        barcodes:
          type: array
          items:
            type: object
            required: [barcode]
            properties:
              id:
                type: integer
                format: int64
                nullable: true
              barcode: {type: string}
              source:
                type: string
                enum: [FACTORY, SYSTEM, LEGACY_UNVERIFIED]
                default: FACTORY
              symbology:
                type: string
                enum: [CODE128, EAN13, EAN8, UPCA, ITF14, UNKNOWN]
              unit_client_key:
                type: string
                description: Refers to units[].client_key during create.
              product_unit_id:
                type: integer
                format: int64
                nullable: true
              is_primary:
                type: boolean
                default: false

