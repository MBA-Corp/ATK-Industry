openapi: 3.1.0
info:
  title: Retail POS API
  version: 1.4.0
  description: |
    API contract v1.4 untuk Retail POS & Inventory Management System.
    Backend: Laravel API. Frontend: React SPA.
    Authentication: Laravel Sanctum first-party SPA.
    Money values pada API dikirim sebagai integer Rupiah (IDR), bukan float.

    Revisi 1: periodic COGS/HPP, profit-loss breakdown, purchasing freight-in/discount, historical inventory valuation.
    Revisi 2: statistical Safety Stock, reorder point, policy fields, stock alert levels and fallback.
    Revisi 3: hardware peripheral audit events and sale/device command separation.
    Pembaruan v1.3: automatic cash drawer open once for every completed/durable sale regardless of CASH, QRIS, or split payment; no trigger while QRIS pending.
    Revisi 4: master data uli.xlsx, SKU auto-allocated, factory/internal barcodes, scan-to-register, unit pricing authority and label artifact.
servers:
  - url: http://localhost:8000
    description: Local development
tags:
  - name: Auth
  - name: Company
  - name: Users
  - name: Roles
  - name: Terminals
  - name: Products
  - name: Suppliers
  - name: Purchases
  - name: Inventory
  - name: Sales
  - name: Returns
  - name: Expenses
  - name: Reports
  - name: Offline Sync

# Endpoint routes (HTTP operations)
paths:
  /sanctum/csrf-cookie:
    get:
      tags: [Auth]
      summary: Initialize Sanctum CSRF cookie
      responses:
        '204':
          description: CSRF cookie initialized

  /login:
    post:
      tags: [Auth]
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: Login successful
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /logout:
    post:
      tags: [Auth]
      summary: Logout current user
      security:
        - sanctum: []
      responses:
        '204':
          description: Logout successful
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/health:
    get:
      summary: API health check
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status:
                        type: string
                        enum: [ok]
                      database:
                        type: string
                        enum: [ok, unavailable]
                      redis:
                        type: string
                        enum: [ok, unavailable]

  /api/v1/me:
    get:
      tags: [Auth]
      summary: Current authenticated user
      security:
        - sanctum: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/company:
    get:
      tags: [Company]
      summary: Get company profile
      security:
        - sanctum: []
      responses:
        '200':
          description: Company profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySingleResponse'
    patch:
      tags: [Company]
      summary: Update company profile
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdateRequest'
      responses:
        '200':
          description: Updated company
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users:
    get:
      tags: [Users]
      summary: List users
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: {type: string}
        - name: is_active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCollectionResponse'
    post:
      tags: [Users]
      summary: Create user
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreateRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/{userId}:
    get:
      tags: [Users]
      summary: Get user
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Users]
      summary: Update user
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/roles:
    get:
      tags: [Roles]
      summary: List roles and permissions
      security:
        - sanctum: []
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleCollectionResponse'

  /api/v1/terminals:
    get:
      tags: [Terminals]
      summary: List registered terminals
      security:
        - sanctum: []
      responses:
        '200':
          description: Terminals
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalCollectionResponse'
    post:
      tags: [Terminals]
      summary: Register terminal
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TerminalCreateRequest'
      responses:
        '201':
          description: Terminal registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TerminalSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/terminals/{terminalUuid}/cash-drawer-events:
    post:
      tags: [Terminals]
      summary: Record cash drawer open event (legacy integration)
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/TerminalUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CashDrawerEventRequest'
      responses:
        '201':
          description: Event recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/terminals/{terminalUuid}/peripheral-events:
    post:
      tags: [Terminals]
      summary: Append a terminal peripheral command audit event
      description: |
        Records a local command outcome after a durable sale or manual user action.
        A completed/durable sale triggers one local open_auto command for CASH-only, QRIS-only, or split payments.
        QRIS pending/unverified must not trigger a drawer command. Do not generate per payment line; deduplicate locally per sale/client_uuid.
        It does not physically print or open the drawer, nor change sale or inventory state.
        event_uuid is an idempotency key: exact replay returns 200; different payload returns 409.
        Cash drawer command_sent means command sent; physical drawer-open state is not sensor-verified.
        Manual UI opening requires cash_drawer.open_manual authorization.
        Legacy cash-drawer-events endpoint must not also record the same event.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/TerminalUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeripheralEventCreateRequest'
      responses:
        '201':
          description: Peripheral event newly recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeripheralEventSingleResponse'
        '200':
          description: Exact idempotent replay of existing event_uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PeripheralEventSingleResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/catalog/scan-lookup:
    get:
      tags: [Products]
      summary: Resolve a scanned barcode or SKU without mutating state
      description: Unknown code returns status not_found and scanned_code for frontend new-product draft; never creates stock, price or product.
      security:
        - sanctum: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Match or not_found result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogScanLookupResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /api/v1/products/{productId}/barcodes:
    post:
      tags: [Products]
      summary: Assign a factory barcode or generate/reuse internal barcode
      description: |
        system mode creates/reuses one Code128 barcode based on product SKU, never alters selling price or inventory.
        factory mode requires barcode string; duplicates mapped elsewhere return 409.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BarcodeAssignmentRequest'
      responses:
        '201':
          description: Barcode assigned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBarcodeSingleResponse'
        '200':
          description: Matching generated barcode already exists, idempotent success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductBarcodeSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{productId}/barcodes/{barcodeId}/print-artifact:
    get:
      tags: [Products]
      summary: Render existing barcode as printable PDF label, never generate a new identity
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: barcodeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Printable barcode label document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/products/{productId}/units/{productUnitId}/price:
    patch:
      tags: [Products]
      summary: Authorized selling price update for a specific product unit
      description: Requires product.change_price; audit old/new price; scanning barcode never automatically changes price.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - name: productUnitId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUnitPriceUpdateRequest'
      responses:
        '200':
          description: Updated product unit after authorization and audit
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductUnitSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products:
    get:
      tags: [Products]
      summary: List/search products
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          description: Search by SKU, barcode, or product name
          schema: {type: string}
        - name: category_id
          in: query
          schema:
            type: integer
            format: int64
        - name: is_active
          in: query
          schema: {type: boolean}
        - name: sort
          in: query
          schema:
            type: string
            enum: [name, -name, sku, -sku, updated_at, -updated_at]
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductCollectionResponse'
    post:
      tags: [Products]
      summary: Create product
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{productId}:
    get:
      tags: [Products]
      summary: Get product detail
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Products]
      summary: Update product
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductWriteRequest'
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{productId}/inventory-policy:
    get:
      tags: [Inventory]
      summary: Get product inventory policy
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Inventory policy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPolicySingleResponse'
    put:
      tags: [Inventory]
      summary: Create or replace product inventory policy
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryPolicyWriteRequest'
      responses:
        '200':
          description: Inventory policy saved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryPolicySingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/suppliers:
    get:
      tags: [Suppliers]
      summary: List suppliers
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: {type: string}
        - name: is_active
          in: query
          schema: {type: boolean}
      responses:
        '200':
          description: Paginated suppliers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierCollectionResponse'
    post:
      tags: [Suppliers]
      summary: Create supplier
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierWriteRequest'
      responses:
        '201':
          description: Supplier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/suppliers/{supplierId}:
    get:
      tags: [Suppliers]
      summary: Get supplier
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      responses:
        '200':
          description: Supplier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Suppliers]
      summary: Update supplier
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/SupplierId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SupplierWriteRequest'
      responses:
        '200':
          description: Supplier updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/products/{productId}/suppliers:
    get:
      tags: [Suppliers]
      summary: Supplier history and latest purchase prices for product
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product supplier information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductSupplierCollectionResponse'

  /api/v1/purchases:
    get:
      tags: [Purchases]
      summary: List purchases
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: supplier_id
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, received, cancelled]
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Purchases
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseCollectionResponse'
    post:
      tags: [Purchases]
      summary: Create purchase draft
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseCreateRequest'
      responses:
        '201':
          description: Purchase draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

      description: Purchase draft includes freight_in_amount and purchase_discount_amount; these belong to inventory
        acquisition, not operating expenses.
  /api/v1/purchases/{purchaseId}:
    get:
      tags: [Purchases]
      summary: Get purchase
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Purchases]
      summary: Update purchase draft
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseUpdateRequest'
      responses:
        '200':
          description: Updated purchase
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSingleResponse'
        '409':
          description: Purchase is no longer editable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/purchases/{purchaseId}/receive:
    post:
      tags: [Purchases]
      summary: Finalize purchase receipt and add stock
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      responses:
        '200':
          description: Purchase received
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseSingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

      description: On receipt, allocate freight-in/discount to purchased items, update inventory carrying value 
        atomically, store received_at.
  /api/v1/purchases/{purchaseId}/attachments:
    post:
      tags: [Purchases]
      summary: Upload supplier invoice attachment
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/PurchaseId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseAttachmentSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/purchase-returns:
    post:
      tags: [Returns]
      summary: Create purchase return
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PurchaseReturnCreateRequest'
      responses:
        '201':
          description: Purchase return created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseReturnSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/inventory:
    get:
      tags: [Inventory]
      summary: List current inventory
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: search
          in: query
          schema: {type: string}
        - name: stock_status
          in: query
          schema:
            type: string
            enum: [all, out_of_stock, critical, reorder_needed, sufficient, insufficient_data]
        - name: movement_class
          in: query
          schema:
            type: string
            enum: [slow, middle, fast]
      responses:
        '200':
          description: Inventory
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCollectionResponse'

  /api/v1/inventory/reorder-alerts:
    get:
      tags: [Inventory]
      summary: List products requiring replenishment
      description: |
        Returns on-hand out_of_stock, critical, and reorder_needed items only.
        insufficient_data items should be reviewed through the main inventory list.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Paginated reorder alerts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryCollectionResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/inventory/{productId}/movements:
    get:
      tags: [Inventory]
      summary: Product stock movement history
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Stock movements
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockMovementCollectionResponse'

  /api/v1/stock-adjustments:
    post:
      tags: [Inventory]
      summary: Create and finalize stock adjustment
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustmentCreateRequest'
      responses:
        '201':
          description: Adjustment completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAdjustmentSingleResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/stock-opnames:
    post:
      tags: [Inventory]
      summary: Start stock opname
      security:
        - sanctum: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Stock opname started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOpnameSingleResponse'

  /api/v1/stock-opnames/{opnameId}/complete:
    post:
      tags: [Inventory]
      summary: Complete stock opname and create adjustments
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/OpnameId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockOpnameCompleteRequest'
      responses:
        '200':
          description: Stock opname completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockOpnameSingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/sales:
    get:
      tags: [Sales]
      summary: List sales
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: cashier_id
          in: query
          schema:
            type: integer
            format: int64
        - name: payment_method
          in: query
          schema:
            type: string
            enum: [CASH, QRIS]
        - name: search
          in: query
          description: Search sale number or client UUID
          schema: {type: string}
      responses:
        '200':
          description: Paginated sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCollectionResponse'
    post:
      tags: [Sales]
      summary: Create and finalize online sale
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleCreateRequest'
      responses:
        '201':
          description: Sale completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleSingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/sales/{saleId}:
    get:
      tags: [Sales]
      summary: Get sale detail
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Sale
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sales/{saleId}/receipt:
    get:
      tags: [Sales]
      summary: Get receipt data for printing or reprint
      description: Read-only receipt data; no local printer or cash drawer command is executed by this HTTP API.
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Receipt payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSingleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/sale-returns:
    post:
      tags: [Returns]
      summary: Create non-destructive sale return/correction
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleReturnCreateRequest'
      responses:
        '201':
          description: Sale return created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleReturnSingleResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/expenses:
    get:
      tags: [Expenses]
      summary: List operating expenses
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - name: category_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Expenses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCollectionResponse'
    post:
      tags: [Expenses]
      summary: Create operating expense
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreateRequest'
      responses:
        '201':
          description: Expense created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseSingleResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/reports/sales-summary:
    get:
      tags: [Reports]
      summary: Sales summary report
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
      responses:
        '200':
          description: Sales summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesSummaryReportResponse'

  /api/v1/reports/sales-detail:
    get:
      tags: [Reports]
      summary: Detailed sales report
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Detailed sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleCollectionResponse'

  /api/v1/reports/profit-loss:
    get:
      tags: [Reports]
      summary: Profit and loss report
      security:
        - sanctum: []
      parameters:
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: compare_from
          in: query
          schema:
            type: string
            format: date
        - name: compare_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Profit and loss
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfitLossReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'

      description: Financial breakdown uses periodic inventory formula from ATK INSAN sample. Revenue is a legacy 
        alias of net_sales. Non-sale stock valuation adjustments require reconciliation review.
  /api/v1/reports/{reportType}/export:
    get:
      tags: [Reports]
      summary: Export report as PDF or XLSX
      security:
        - sanctum: []
      parameters:
        - name: reportType
          in: path
          required: true
          schema:
            type: string
            enum: [sales-summary, sales-detail, profit-loss]
        - $ref: '#/components/parameters/FromDate'
        - $ref: '#/components/parameters/ToDate'
        - name: format
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, xlsx]
      responses:
        '200':
          description: Generated report file
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/offline/bootstrap:
    get:
      tags: [Offline Sync]
      summary: Get minimum dataset required for offline POS
      security:
        - sanctum: []
      parameters:
        - name: terminal_uuid
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Offline bootstrap payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineBootstrapResponse'

  /api/v1/offline/changes:
    get:
      tags: [Offline Sync]
      summary: Incremental offline catalog changes
      security:
        - sanctum: []
      parameters:
        - name: since
          in: query
          required: true
          description: Last successful synchronization timestamp
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Incremental changes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineChangesResponse'

  /api/v1/offline/sales-sync:
    post:
      tags: [Offline Sync]
      summary: Synchronize locally completed sales
      description: |
        Idempotent batch sync menggunakan client_uuid.
        Item dengan UUID yang sudah pernah diproses tidak dibuat ulang.
      security:
        - sanctum: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfflineSalesSyncRequest'
      responses:
        '200':
          description: Per-sale synchronization result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSalesSyncResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/reports/inventory-valuation:
    get:
      tags:
        - Reports
      summary: Historical inventory valuation as of business date
      description: Recover historical carrying value from value-aware stock movements; current average cost cannot 
        revalue past balances.
      security:
        - sanctum: []
      parameters:
        - name: as_of
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Historical inventory valuation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryValuationReportResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
# Shared parameters, responses, security schemes, and data schemas
components:
  securitySchemes:
    sanctum:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel Sanctum first-party SPA session cookie

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    ProductId:
      name: productId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SupplierId:
      name: supplierId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PurchaseId:
      name: purchaseId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    SaleId:
      name: saleId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OpnameId:
      name: opnameId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TerminalUuid:
      name: terminalUuid
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FromDate:
      name: from
      in: query
      required: true
      schema:
        type: string
        format: date
    ToDate:
      name: to
      in: query
      required: true
      schema:
        type: string
        format: date

  responses:
    Unauthenticated:
      description: User is not authenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: User has no required permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Request conflicts with current domain state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    TooManyRequests:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Money:
      type: integer
      format: int64
      minimum: 0
      description: Integer Rupiah (IDR). Never send floating-point money values.

    SignedMoney:
      type: integer
      format: int64
      description: Signed integer Rupiah (IDR).

    Quantity:
      type: number
      format: decimal
      minimum: 0
      multipleOf: 0.001

    SignedQuantity:
      type: number
      format: decimal
      multipleOf: 0.001

    PaginationMeta:
      type: object
      required: [current_page, per_page, total, last_page]
      properties:
        current_page: {type: integer}
        per_page: {type: integer}
        total: {type: integer}
        last_page: {type: integer}

    ErrorResponse:
      type: object
      required: [message]
      properties:
        message: {type: string}
        code:
          type: string
          nullable: true
          examples: [INSUFFICIENT_STOCK]
        details:
          type: object
          additionalProperties: true
          nullable: true

    ValidationErrorResponse:
      type: object
      required: [message, errors]
      properties:
        message:
          type: string
          example: Validation failed.
        errors:
          type: object
          additionalProperties:
            type: array
            items: {type: string}

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login:
          type: string
          description: Username or email
        password:
          type: string
          format: password

    Permission:
      type: object
      required: [code, name]
      properties:
        code: {type: string}
        name: {type: string}

    Role:
      type: object
      required: [id, code, name]
      properties:
        id:
          type: integer
          format: int64
        code: {type: string}
        name: {type: string}
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    User:
      type: object
      required: [id, name, username, is_active, roles, permissions]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        username: {type: string}
        email:
          type: string
          format: email
          nullable: true
        is_active: {type: boolean}
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        permissions:
          type: array
          items:
            type: string

    UserSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/User'

    UserCollectionResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    UserCreateRequest:
      type: object
      required: [name, username, password, role_ids]
      properties:
        name: {type: string}
        username: {type: string}
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          minLength: 8
        is_active:
          type: boolean
          default: true
        role_ids:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64

    UserUpdateRequest:
      type: object
      properties:
        name: {type: string}
        username: {type: string}
        email:
          type: string
          format: email
          nullable: true
        password:
          type: string
          minLength: 8
        is_active: {type: boolean}
        role_ids:
          type: array
          items:
            type: integer
            format: int64

    RoleCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    Company:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name: {type: string}
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        logo_url:
          type: string
          nullable: true

    CompanySingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Company'

    CompanyUpdateRequest:
      type: object
      properties:
        name: {type: string}
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        logo_path:
          type: string
          nullable: true

    Terminal:
      type: object
      required: [terminal_uuid, name, is_active]
      properties:
        terminal_uuid:
          type: string
          format: uuid
        name: {type: string}
        device_name:
          type: string
          nullable: true
        is_active: {type: boolean}
        last_seen_at:
          type: string
          format: date-time
          nullable: true

    TerminalCreateRequest:
      type: object
      required: [terminal_uuid, name]
      properties:
        terminal_uuid:
          type: string
          format: uuid
        name: {type: string}
        device_name:
          type: string
          nullable: true

    TerminalSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Terminal'

    TerminalCollectionResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Terminal'

    CashDrawerEventRequest:
      type: object
      required: [event_type]
      properties:
        event_type:
          type: string
          enum: [manual_open, automatic_open]
        reason:
          type: string
          nullable: true

    AuditEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id:
          type: integer
          format: int64
        action: {type: string}
        created_at:
          type: string
          format: date-time

    AuditEventSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AuditEvent'

    PeripheralEventCreateRequest:
      type: object
      description: |
        Append-only audit of local hardware command outcome. The client must persist
        event_uuid durably and reuse it on API retry. This endpoint is not a hardware command.
        For cash_drawer/open_auto, emit one command only after the sale is completed/durable,
        irrespective of CASH, QRIS, or split payment; not while QRIS is pending/unverified.
      required: [event_uuid, command_uuid, peripheral_type, action, source, outcome, occurred_at]
      properties:
        event_uuid:
          type: string
          format: uuid
        command_uuid:
          type: string
          format: uuid
        sale_id:
          type: [integer, 'null']
          format: int64
        client_uuid:
          type: [string, 'null']
          format: uuid
        peripheral_type:
          type: string
          enum: [receipt_printer, cash_drawer, barcode_scanner]
        action:
          type: string
          enum: [print_receipt, reprint_receipt, open_auto, open_manual, scan_test]
        source:
          type: string
          enum: [pos, manual_ui, test]
        outcome:
          type: string
          enum: [command_sent, failed, unknown]
          description: command_sent does not prove physical drawer opening without a sensor.
        error_code:
          type: [string, 'null']
          maxLength: 80
        occurred_at:
          type: string
          format: date-time

    PeripheralEvent:
      allOf:
        - $ref: '#/components/schemas/PeripheralEventCreateRequest'
        - type: object
          required: [id, created_at]
          properties:
            id:
              type: integer
              format: int64
            created_at:
              type: string
              format: date-time

    PeripheralEventSingleResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PeripheralEvent'

    ProductUnit:
      type: object
      required: [id, unit_id, unit_code, unit_name, conversion_to_base, selling_price, is_base, is_active]
      properties:
        id:
          type: integer
          format: int64
        unit_id:
          type: integer
          format: int64
        unit_code: {type: string}
        unit_name: {type: string}
        conversion_to_base:
          type: number
          format: decimal
          exclusiveMinimum: 0
        selling_price:
          $ref: '#/components/schemas/Money'
        is_base: {type: boolean}
        is_active: {type: boolean}

    ProductBarcode:
      type: object
      required: [id, barcode, is_primary]
      properties:
        source:
          type: string
          enum: [FACTORY, SYSTEM, LEGACY_UNVERIFIED]
          description: Provenance of the barcode, legacy source may be unverified.
        symbology:
          type: string
          enum: [CODE128, EAN13, EAN8, UPCA, ITF14, UNKNOWN]
          description: UNKNOWN for imported values until the barcode type is confirmed.
        id:
          type: integer
          format: int64
        barcode: {type: string}
        product_unit_id:
          type: integer
          format: int64
          nullable: true
        is_primary: {type: boolean}

    Product:
      type: object
      required: [id, sku, name, is_active, units, barcodes]
      properties:
        id:
          type: integer
          format: int64
        sku: {type: string}
        name: {type: string}
        brand_name:
          type: [string, 'null']
        rack_location:
          type: [string, 'null']
        category:
          type: object
          nullable: true
          properties:
            id:
              type: integer
              format: int64
            name: {type: string}
        size:
          type: string
          nullable: true
        color:
          type: string
          nullable: true
        variant_label:
          type: string
          nullable: true
        is_active: {type: boolean}
        units:
          type: array
          items:
            $ref: '#/components/schemas/ProductUnit'
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        inventory:
          $ref: '#/components/schemas/ProductInventorySummary'
        updated_at:
          type: string
          format: date-time

    ProductWriteRequest:
      type: object
      description: Core product write fields. Create request additionally enforces provided SKU or auto SKU generation.
      required: [name, units]
      properties:
        sku: {type: string}
        sku_mode:
          type: string
          enum: [provided, auto]
          default: provided
        generate_internal_barcode:
          type: boolean
          default: false
        name: {type: string}
        brand_name:
          type: [string, 'null']
        rack_location:
          type: [string, 'null']
        category_id:
          type: integer
          format: int64
          nullable: true
        size:
          type: string
          nullable: true
