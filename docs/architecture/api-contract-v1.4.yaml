      properties:
        data:
          type: object
          required: [from, to, gross_sales, returns, net_sales, transaction_count]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            gross_sales:
              $ref: '#/components/schemas/Money'
            returns:
              $ref: '#/components/schemas/Money'
            net_sales:
              $ref: '#/components/schemas/Money'
            transaction_count: {type: integer}
            cash_total:
              $ref: '#/components/schemas/Money'
            qris_total:
              $ref: '#/components/schemas/Money'

    ProfitLossReportResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [from, to, revenue, cogs, gross_profit, operating_expenses, net_profit, gross_sales, 
                sales_returns, sales_discounts, net_sales, opening_inventory, gross_purchases, freight_in, 
                purchase_returns, purchase_discounts, net_purchases, goods_available_for_sale, ending_inventory, 
                operating_expense_breakdown, reconciliation_status]
          properties:
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            revenue:
              $ref: '#/components/schemas/Money'
              description: Legacy alias for net_sales; do not add to net_sales. Kept for API v1 compatibility.
            cogs:
              $ref: '#/components/schemas/Money'
              description: HPP periodik dasar = opening_inventory + net_purchases - ending_inventory; review 
                adjustment inventory non-penjualan.
            gross_profit:
              $ref: '#/components/schemas/SignedMoney'
            operating_expenses:
              $ref: '#/components/schemas/Money'
            net_profit:
              $ref: '#/components/schemas/SignedMoney'
            comparison:
              type: object
              nullable: true
              properties:
                revenue:
                  $ref: '#/components/schemas/SignedMoney'
                gross_profit:
                  $ref: '#/components/schemas/SignedMoney'
                net_profit:
                  $ref: '#/components/schemas/SignedMoney'

            gross_sales:
              $ref: '#/components/schemas/Money'
            sales_returns:
              $ref: '#/components/schemas/Money'
            sales_discounts:
              $ref: '#/components/schemas/Money'
            net_sales:
              $ref: '#/components/schemas/Money'
            opening_inventory:
              $ref: '#/components/schemas/Money'
            gross_purchases:
              $ref: '#/components/schemas/Money'
            freight_in:
              $ref: '#/components/schemas/Money'
            purchase_returns:
              $ref: '#/components/schemas/Money'
            purchase_discounts:
              $ref: '#/components/schemas/Money'
            net_purchases:
              $ref: '#/components/schemas/Money'
            goods_available_for_sale:
              $ref: '#/components/schemas/Money'
            ending_inventory:
              $ref: '#/components/schemas/Money'
            operating_expense_breakdown:
              type: array
              items:
                $ref: '#/components/schemas/OperatingExpenseBreakdownRow'
            reconciliation_status:
              type: string
              enum:
                - reconciled
                - requires_review
              description: requires_review jika penyesuaian nilai stok non-penjualan belum direkonsiliasi secara 
                finansial.
            reconciliation_notes:
              type: array
              items:
                type: string
          example:
            from: '2026-01-01'
            to: '2026-01-31'
            gross_sales: 16000000
            sales_returns: 200000
            sales_discounts: 100000
            net_sales: 15700000
            revenue: 15700000
            opening_inventory: 8000000
            gross_purchases: 5000000
            freight_in: 200000
            purchase_returns: 100000
            purchase_discounts: 50000
            net_purchases: 5050000
            goods_available_for_sale: 13050000
            ending_inventory: 3000000
            cogs: 10050000
            gross_profit: 5650000
            operating_expenses: 1700000
            operating_expense_breakdown:
              - category: Gaji karyawan
                amount: 1000000
              - category: Listrik dan internet
                amount: 400000
              - category: Operasional lainnya
                amount: 300000
            net_profit: 3950000
            reconciliation_status: reconciled
            reconciliation_notes: []
    OfflineProduct:
      type: object
      required: [id, sku, name, units, barcodes, inventory_quantity_base, updated_at]
      properties:
        id:
          type: integer
          format: int64
        sku: {type: string}
        name: {type: string}
        is_active: {type: boolean}
        units:
          type: array
          items:
            $ref: '#/components/schemas/ProductUnit'
        barcodes:
          type: array
          items:
            $ref: '#/components/schemas/ProductBarcode'
        inventory_quantity_base:
          $ref: '#/components/schemas/Quantity'
        updated_at:
          type: string
          format: date-time

    OfflineBootstrapResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [server_time, terminal, user, products]
          properties:
            server_time:
              type: string
              format: date-time
            terminal:
              $ref: '#/components/schemas/Terminal'
            user:
              $ref: '#/components/schemas/User'
            products:
              type: array
              items:
                $ref: '#/components/schemas/OfflineProduct'

    OfflineChangesResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [server_time, products]
          properties:
            server_time:
              type: string
              format: date-time
            products:
              type: array
              items:
                $ref: '#/components/schemas/OfflineProduct'
            deleted_product_ids:
              type: array
              items:
                type: integer
                format: int64

    OfflineSalesSyncRequest:
      type: object
      required: [terminal_uuid, sales]
      properties:
        terminal_uuid:
          type: string
          format: uuid
        sales:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/SaleCreateRequest'

    OfflineSalesSyncResult:
      type: object
      required: [client_uuid, status]
      properties:
        client_uuid:
          type: string
          format: uuid
        status:
          type: string
          enum: [synced, already_synced, conflict, rejected]
        sale_id:
          type: integer
          format: int64
          nullable: true
        sale_no:
          type: string
          nullable: true
        conflict_code:
          type: string
          nullable: true
          enum: [INSUFFICIENT_STOCK, PRODUCT_INACTIVE, UNKNOWN_PRODUCT, UNKNOWN_UNIT, PRICE_CONFLICT, 
                INVALID_PAYMENT, OTHER]
        message:
          type: string
          nullable: true

    OfflineSalesSyncResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OfflineSalesSyncResult'
    OperatingExpenseBreakdownRow:
      type: object
      required:
        - category
        - amount
      properties:
        category:
          type: string
        amount:
          $ref: '#/components/schemas/Money'
    InventoryValuationReportResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          required:
            - as_of
            - inventory_value
            - products
          properties:
            as_of:
              type: string
              format: date
            inventory_value:
              $ref: '#/components/schemas/Money'
            products:
              type: array
              items:
                $ref: '#/components/schemas/InventoryValuationProduct'
            reconciliation_status:
              type: string
              enum:
                - reconciled
                - requires_review
    InventoryValuationProduct:
      type: object
      required:
        - product_id
        - quantity_base
        - inventory_value
      properties:
        product_id:
          type: integer
          format: int64
        quantity_base:
          $ref: '#/components/schemas/Quantity'
        inventory_value:
          $ref: '#/components/schemas/Money'
