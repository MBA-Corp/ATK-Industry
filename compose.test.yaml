# Standalone test project: no published ports, no development volumes or networks.
services:
  mysql-test:
    image: mysql:8.4
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: atk_industry_test
      MYSQL_USER: atk_test
      MYSQL_PASSWORD: disposable-test-only
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u atk_test atk_industry_test -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 30s
  api-test:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    working_dir: /var/www/html
    volumes:
      - ./apps/api:/var/www/html
    tmpfs:
      - /var/www/html/vendor
      - /var/www/html/storage
      - /var/www/html/bootstrap/cache
    environment:
      APP_ENV: testing
      APP_KEY: "base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: mysql-test
      DB_PORT: "3306"
      DB_DATABASE: atk_industry_test
      DB_USERNAME: atk_test
      DB_PASSWORD: disposable-test-only
      DB_URL: ""
      DB_SOCKET: ""
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      COMPOSER_ALLOW_SUPERUSER: "1"
    depends_on:
      mysql-test:
        condition: service_healthy
    command: >
      sh -ec "mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache;
      composer install --no-interaction --prefer-dist --no-progress;
      DB_CONNECTION=sqlite DB_DATABASE=:memory: php vendor/bin/phpunit --colors=never;
      php vendor/bin/phpunit --colors=never;
      php vendor/bin/pint --test;
      composer check-platform-reqs"
